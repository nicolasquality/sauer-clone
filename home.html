<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <title>Sauer Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>

  <header>
    <nav aria-label="Navegação principal" role="navigation" class="navbar">
      <ul class="navlist">
        <li>
          <a href="#" aria-label="Página inicial">
            <img src="assets/images/images/logo.svg" alt="Logo da Sauer">
          </a>
        </li>
        <li><a href="#">Início</a></li>
        <li><a href="#">Coleções</a></li>
        <li><a href="#">Linhas</a></li>
        <li><a href="#">Categorias</a></li>
        <li><a href="#">História</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo">
    <section aria-labelledby="section-principal">
      <figure>
        <img src="assets/images/images/banner-principal.webp"
          alt="Foto principal do site, contendo uma mulher utilizando um colar Sauer">
      </figure>
    </section>

    <section aria-labelledby="titulo-colecoes" id="colecoes">
      <p class="titulo-colecoes">Coleções</p>
    </section>

    <section aria-labelledby="section-cards" id="section-cards">
      <ul>
        <li>
          <figure>
            <img src="assets/images/images/produto_01.webp">
          </figure>
        </li>
        <li>
          <figure>
            <img src="assets/images/images/produto_02.webp" alt="Peça da coleção Ethos: colar com pingente geométrico">
          </figure>
        </li>
        <li>
          <figure>
            <img src="assets/images/images/produto_03.webp" alt="Produto 3">
          </figure>
        </li>
      </ul>
  </main>
</body>

</html>
